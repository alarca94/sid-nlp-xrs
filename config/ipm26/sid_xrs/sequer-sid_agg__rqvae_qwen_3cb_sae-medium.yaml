data:
  load_cols: [review]
  class_name: SEQUERDataset
  train_workers: 4
  eval_workers: 4
  hist_len: 20
  word_tok: default
  batch_size: 128
  seq_mode: HIST_ITEM
  requires_nextitem: true
  semantic_id:
    item:
      config_name: rqvae_qwen_3cb_sae-medium
      mode: replace
      dedup_items_on_load: false
model:
  name: SEQUER
  suffix: -SID_AGG__rqvae_qwen_3cb_sae-medium
  emsize: 256
  nhid: 2048
  nhead: 2
  nlayers: 2
  dropout: 0.21
  use_feature: false
  mask_type: causal
  init_codebooks: false
  sid_agg: mean
  freeze_codebooks: false
  intra_item_attention: false
  nextitem_loss: CE
  mtl_aggregator:
    name: sum
    weights:
      explanation: 1.0
      context: 1.0
      rating: 0.1
      next_item: 0.1
train:
  clip_norm: 1.0
  scheduler:
    name: steplr
  optim:
    name: adamw
    lr: 0.001
